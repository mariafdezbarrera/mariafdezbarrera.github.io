    title: "Research projects"
    groups:
      - items:
          - title: "NutritionBERT: a physically and biochemically constrained masked Transformer for nutrient profile prediction"
            meta: "A masked Transformer that predicts the nutrient profile of foods from their molecular composition, with physical and biochemical constraints built into the model, evaluated on a leakage-controlled benchmark so that results reflect generalisation to unseen foods rather than memorisation of near-duplicates."
            badges:
              - text: "in progress"
          - title: "AI-driven Collision Cross Section (CCS) prediction for metabolomics"
            meta: "Research placement, MSc Biomedical Data Science, Universitat Rovira i Virgili. CCS prediction from molecular structure for molecular identification in ion mobility spectrometry: a reproducible baseline from molecular fingerprints, m/z and adduct type, benchmarked against Mol2Vec and ChemBERTa SMILES embeddings, with analysis by adduct type."

