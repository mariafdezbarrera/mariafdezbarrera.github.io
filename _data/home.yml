# Sección Research
research: |
  I work on artificial intelligence and computer vision for biology and medicine: medical image analysis,
  computer-aided diagnosis, multimodal models, clinical omics and food computing, with a focus on models whose reported
  performance reflects real generalisation. My supervisors are:

