# Biografía (admite Markdown: **negrita**, [enlace](url), párrafos separados por línea en blanco)
bio: |
  I am a PhD candidate at the [Faculty of Mathematics and Computer Science, Universitat de Barcelona](https://mat.ub.edu/en/),
  and a member of the [AIBA](https://www.ub.edu/aiba/) research group. My research focuses on artificial intelligence and
  computer vision applied to biology and medicine, and I supervise students in their research projects.

  Before the PhD I spent nearly 20 years as an R&D, engineering and architecture expert, turning Data & AI research and solutions
  into production systems for regulated industries.
  I hold an MSc in Biomedical Data Science from the Universitat Rovira i Virgili, an MSc in Advanced and Applied Artificial
  Intelligence from the Universitat de València, and a First Class BSc (Hons) in Computing from Edinburgh Napier University.

